name: Update draws

# Started by an external cron through the GitHub API (no GitHub schedule), Berlin time:
#   every 15 min Wed 18:30-23:45 and Sat 19:30-23:45 (draws 18:25 / 19:25), verify=false
#   daily 05:00, verify=true: re-checks the last draws; fails (= mail) if a draw is still missing
#   POST https://api.github.com/repos/enoks/LottOrakel-Data/actions/workflows/update.yml/dispatches
#   {"ref": "main", "inputs": {"verify": "true"}}
on:
  workflow_dispatch:
    inputs:
      verify:
        description: Re-check the last 3 draws against lotto.de (daily run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: update
        run: node scripts/update.mjs
        env:
          # format(): the API may send the boolean as a string.
          VERIFY: ${{ format('{0}', inputs.verify) == 'true' && '1' || '0' }}
      - name: Commit new draws
        if: steps.update.outputs.message != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898276+github-actions[bot]@users.noreply.github.com'
          git commit -am "${{ steps.update.outputs.message }}"
          git push
      # Rebuilds the LottOrakel web app with the new draws (prerendered statistics for crawlers).
      # Secret LOTTORAKEL_DISPATCH_TOKEN: fine-grained PAT, only enoks/LottOrakel, Contents: write.
      - name: Trigger web build
        if: steps.update.outputs.message != ''
        env:
          GH_TOKEN: ${{ secrets.LOTTORAKEL_DISPATCH_TOKEN }}
        run: gh api repos/enoks/LottOrakel/dispatches -f event_type=draws-updated -f "client_payload[sha]=$(git rev-parse HEAD)"
